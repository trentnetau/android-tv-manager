services:
  android-tv-manager:
    build: .
    container_name: android-tv-manager
    ports:
      - "8080:8080"
    environment:
      # Optional: protect the UI when exposed beyond your LAN
      # AUTH_USERNAME: admin
      # AUTH_PASSWORD: change-me
      ADB_PATH: /usr/bin/adb
    # Host network lets the container reach TVs on your LAN (recommended for ADB)
    network_mode: host
    restart: unless-stopped
